<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300">
  <defs>
    <linearGradient id="dynaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923" />
      <stop offset="50%" stop-color="#003554" />
      <stop offset="100%" stop-color="#006494" />
    </linearGradient>

    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A6FB" />
      <stop offset="50%" stop-color="#05B2DC" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>

    <filter id="dynaGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dynaPulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 15px rgba(6, 214, 160, 0.7)); }
      50% { opacity: 1; filter: drop-shadow(0 0 30px rgba(0, 166, 251, 1)); }
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .bg-dyna { fill: url(#dynaBg); }
    .title-dyna { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 44px; fill: url(#cyanTeal); animation: dynaPulse 3.5s infinite ease-in-out; }
    .sub-dyna { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; fill: #90E0EF; letter-spacing: 3px; }
    .wire-dyna { stroke: url(#cyanTeal); stroke-width: 2; fill: none; stroke-dasharray: 14 7; animation: lineFlow 14s linear infinite; opacity: 0.5; }
    .badge-dyna { fill: #002B45; stroke: #00A6FB; stroke-width: 1.5; rx: 6px; }
    .btext-dyna { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #06D6A0; }
  </style>

  <rect class="bg-dyna" width="920" height="300" rx="14" stroke="#00A6FB" stroke-width="1.5" />
  <path class="wire-dyna" d="M 50,40 H 870 M 50,260 H 870 M 100,0 V 300 M 820,0 V 300 M 50,150 H 870" />

  <g transform="translate(460, 95)">
    <polygon points="0,-42 34,-20 34,20 0,42 -34,20 -34,-20" fill="#002B45" stroke="url(#cyanTeal)" stroke-width="3" filter="url(#dynaGlow)" />
    <circle cx="0" cy="0" r="10" fill="#06D6A0" />
  </g>

  <text x="460" y="185" text-anchor="middle" class="title-dyna">DYNATECH DRAKE</text>
  <text x="460" y="215" text-anchor="middle" class="sub-dyna">AUTOMATED HYDROPONICS &amp; ORE WASHING · RUST FFM ENGINE</text>

  <g transform="translate(230, 245)">
    <rect x="0" y="0" width="145" height="30" class="badge-dyna" />
    <text x="12" y="20" class="btext-dyna">AUTOMATION TECH</text>

    <rect x="165" y="0" width="150" height="30" class="badge-dyna" stroke="#06D6A0" />
    <text x="177" y="20" class="btext-dyna" fill="#06D6A0">RUST FFM HYBRID</text>

    <rect x="335" y="0" width="135" height="30" class="badge-dyna" stroke="#00A6FB" />
    <text x="347" y="20" class="btext-dyna" fill="#00A6FB">PAPER 1.21.11</text>
  </g>
</svg>
